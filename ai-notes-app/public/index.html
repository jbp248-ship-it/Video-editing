<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin's AI Note Taker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#D97757" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#1a1a1a;color:#ECECEC;min-height:100vh;-webkit-font-smoothing:antialiased}

    /* ── Top Nav ── */
    .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:50}
    .nav-left{display:flex;align-items:center;gap:12px}
    .nav-logo{width:32px;height:32px;background:#D97757;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
    .nav h1{font-size:18px;font-weight:700;color:#ECECEC;letter-spacing:-0.3px}
    .nav h1 span{color:#D97757}
    .nav-right{display:flex;align-items:center;gap:12px}
    .nav-search{padding:8px 16px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;color:#ECECEC;font-size:13px;font-family:inherit;outline:none;width:260px;transition:border .2s}
    .nav-search:focus{border-color:#D97757}
    .nav-search::placeholder{color:#6b6b6b}
    .nav-rec{padding:10px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
    .nav-rec.idle{background:#D97757;color:#fff}
    .nav-rec.idle:hover{background:#c4684a;transform:translateY(-1px);box-shadow:0 4px 16px rgba(217,119,87,.3)}
    .nav-rec.on{background:#E8B931;color:#1a1a1a}
    .tmr{font-family:'JetBrains Mono',monospace;font-size:14px;color:#D97757;font-variant-numeric:tabular-nums;display:none}
    .wc{font-size:12px;color:#6b6b6b;display:none}
    .mtr{width:120px;height:5px;background:#2a2a2a;border-radius:3px;overflow:hidden;display:none}
    .mtr-f{height:100%;background:linear-gradient(90deg,#D97757,#E8B931);border-radius:3px;transition:width 80ms;width:0}

    /* ── Breadcrumb ── */
    .bread{padding:16px 32px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:#6b6b6b}
    .bread a{color:#D97757;text-decoration:none;cursor:pointer;font-weight:500}
    .bread a:hover{text-decoration:underline}
    .bread span{color:#4a4a4a}

    /* ── Main Content ── */
    .main{padding:24px 32px;max-width:1200px;margin:0 auto}

    /* ── Course Grid (Google Drive style) ── */
    .section-title{font-size:13px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:32px}
    .folder{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative}
    .folder:hover{border-color:#D97757;background:#2f2a28;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
    .folder-icon{font-size:32px;margin-bottom:12px}
    .folder h3{font-size:14px;font-weight:600;color:#ECECEC;margin-bottom:4px}
    .folder p{font-size:12px;color:#6b6b6b}
    .folder-del{position:absolute;top:10px;right:10px;background:none;border:none;color:#4a4a4a;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:4px;opacity:0;transition:all .15s}
    .folder:hover .folder-del{opacity:1}
    .folder-del:hover{color:#ef4444;background:rgba(239,68,68,.1)}

    .add-folder{background:transparent;border:2px dashed #3a3a3a;border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}
    .add-folder:hover{border-color:#D97757;background:rgba(217,119,87,.05)}
    .add-folder span{font-size:24px;color:#4a4a4a;margin-bottom:4px}
    .add-folder p{font-size:12px;color:#6b6b6b}

    .add-folder-form{background:#2a2a2a;border:1px solid #D97757;border-radius:12px;padding:16px;display:none}
    .add-folder-form.v{display:block}
    .add-folder-form input{width:100%;padding:10px 12px;background:#1a1a1a;border:1px solid #3a3a3a;border-radius:8px;color:#ECECEC;font-size:14px;font-family:inherit;outline:none;margin-bottom:8px}
    .add-folder-form input:focus{border-color:#D97757}
    .add-folder-form .btns{display:flex;gap:6px;justify-content:flex-end}
    .add-folder-form button{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500}
    .add-folder-form .ok{background:#D97757;color:#fff}
    .add-folder-form .cancel{background:#3a3a3a;color:#ECECEC}

    /* ── Notes inside a course ── */
    .day-group{margin-bottom:8px}
    .day-hdr{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;user-select:none}
    .day-hdr:hover .day-title{color:#D97757}
    .day-arrow{font-size:10px;color:#4a4a4a;transition:transform .2s;display:inline-block;width:16px}
    .day-arrow.open{transform:rotate(90deg)}
    .day-title{font-size:13px;font-weight:600;color:#9b9b9b;transition:color .15s}
    .day-stats{font-size:11px;color:#4a4a4a;margin-left:auto}

    .note{padding:14px 18px;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;margin:0 0 6px 24px;cursor:pointer;transition:all .15s}
    .note:hover{border-color:rgba(217,119,87,.4);background:#302a28}
    .note-top{display:flex;justify-content:space-between;align-items:flex-start}
    .note-info{flex:1;min-width:0}
    .note h3{font-size:14px;font-weight:600;color:#ECECEC;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note-time{font-size:11px;color:#6b6b6b}
    .note-meta{display:flex;gap:10px;font-size:12px;color:#6b6b6b;margin-top:4px;align-items:center}
    .tag{background:rgba(217,119,87,.12);color:#D97757;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:500}
    .note-pv{font-size:13px;color:#6b6b6b;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .note-del{background:none;border:none;color:#4a4a4a;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .note-del:hover{color:#ef4444;background:rgba(239,68,68,.1)}

    /* ── Detail view ── */
    .detail-hdr{margin-bottom:24px}
    .detail-hdr h2{font-size:22px;font-weight:700;color:#ECECEC;margin-bottom:8px;line-height:1.3}
    .detail-meta{display:flex;gap:12px;font-size:12px;color:#6b6b6b;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{padding:8px 18px;border:1px solid #3a3a3a;border-radius:8px;background:#2a2a2a;color:#ECECEC;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500}
    .btn:hover{background:#3a3a3a}
    .btn-pri{background:#D97757;border-color:#D97757;color:#fff}
    .btn-pri:hover{background:#c4684a}
    .btn-dng{border-color:rgba(239,68,68,.3);color:#fca5a5}
    .btn-dng:hover{background:rgba(239,68,68,.12)}
    .transcript-box{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;padding:24px;line-height:1.8;font-size:14px;white-space:pre-wrap;max-height:55vh;overflow-y:auto;margin-top:16px}
    .transcript-box .ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:#D97757;background:rgba(217,119,87,.1);padding:2px 7px;border-radius:4px;margin-right:10px}
    .summary-box{background:rgba(217,119,87,.06);border:1px solid rgba(217,119,87,.15);border-radius:10px;padding:20px;margin-top:16px;line-height:1.7;font-size:14px;white-space:pre-wrap}
    .summary-box h3{font-size:14px;font-weight:600;color:#D97757;margin-bottom:8px}

    /* ── Live recording ── */
    .live-line{padding:8px 0;font-size:15px;line-height:1.7;color:#ECECEC;border-bottom:1px solid #2a2a2a}
    .live-line .ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:#D97757;background:rgba(217,119,87,.1);padding:2px 7px;border-radius:4px;margin-right:10px}
    .live-interim{color:#6b6b6b;font-style:italic}

    /* ── Empty state ── */
    .empty{text-align:center;padding:80px 20px}
    .empty h2{font-size:24px;color:#6b6b6b;margin-bottom:8px}
    .empty p{color:#4a4a4a;font-size:14px;line-height:1.6}

    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
    @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
    .note,.folder{animation:fi .15s ease-out}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">J</div>
      <h1><span>Justin's</span> AI Note Taker</h1>
    </div>
    <div class="nav-right">
      <input class="nav-search" id="search" placeholder="Search all lectures..." />
      <div class="mtr" id="meter"><div class="mtr-f" id="meterFill"></div></div>
      <span class="wc" id="wordCount">0 words</span>
      <span class="tmr" id="timer">00:00:00</span>
      <button class="nav-rec idle" id="recBtn">Start Recording</button>
    </div>
  </nav>
  <div id="bread" class="bread"></div>
  <div class="main" id="content">
    <div class="empty"><h2>Welcome, Justin</h2><p>Create a course folder to get started.</p></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
