<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Justin's AI Note Taker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#D97757" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#2F2722;color:#E8E0D8;min-height:100vh;-webkit-font-smoothing:antialiased}

    /* ── Top Nav ── */
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:#2F2722;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
    .nav-left{display:flex;align-items:center;gap:12px}
    .nav-logo{width:34px;height:34px;background:linear-gradient(135deg,#D97757,#C4684A);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:17px;box-shadow:0 2px 8px rgba(217,119,87,.25)}
    .nav h1{font-size:17px;font-weight:600;color:#E8E0D8;letter-spacing:-.3px}
    .nav h1 span{color:#D97757;font-weight:700}
    .nav-right{display:flex;align-items:center;gap:12px}
    .nav-search{padding:9px 16px;background:#3D3530;border:1px solid #4A403A;border-radius:12px;color:#E8E0D8;font-size:13px;font-family:inherit;outline:none;width:260px;transition:all .2s}
    .nav-search:focus{border-color:#D97757;background:#453D37;box-shadow:0 0 0 3px rgba(217,119,87,.12)}
    .nav-search::placeholder{color:#8B7E75}
    .nav-rec{padding:10px 24px;border:none;border-radius:12px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;white-space:nowrap}
    .nav-rec.idle{background:linear-gradient(135deg,#D97757,#C4684A);color:#fff;box-shadow:0 2px 12px rgba(217,119,87,.25)}
    .nav-rec.idle:hover{box-shadow:0 4px 20px rgba(217,119,87,.4);transform:translateY(-1px)}
    .nav-rec.on{background:#E8B931;color:#2F2722;box-shadow:0 2px 12px rgba(232,185,49,.25)}
    .tmr{font-family:'JetBrains Mono',monospace;font-size:14px;color:#D97757;font-variant-numeric:tabular-nums;display:none}
    .wc{font-size:12px;color:#8B7E75;display:none}
    .mtr{width:100px;height:4px;background:#3D3530;border-radius:2px;overflow:hidden;display:none}
    .mtr-f{height:100%;background:linear-gradient(90deg,#D97757,#E8B931);border-radius:2px;transition:width 80ms;width:0}

    /* ── Breadcrumb ── */
    .bread{padding:12px 32px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:#8B7E75}
    .bread a{color:#D97757;text-decoration:none;cursor:pointer;font-weight:500;transition:color .15s}
    .bread a:hover{color:#E8B931}
    .bread span{color:#5A4F48}

    /* ── Main Content ── */
    .main{padding:24px 32px 48px;max-width:1100px;margin:0 auto}

    /* ── Welcome greeting ── */
    .greeting{padding:40px 0 32px;text-align:center}
    .greeting h2{font-size:28px;font-weight:700;color:#E8E0D8;margin-bottom:6px}
    .greeting h2 span{color:#D97757}
    .greeting p{color:#8B7E75;font-size:15px}

    /* ── Section title ── */
    .section-title{font-size:12px;font-weight:600;color:#8B7E75;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px}

    /* ── Course Grid ── */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:32px}
    .folder{background:#3D3530;border:1px solid #4A403A;border-radius:14px;padding:22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
    .folder::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#D97757,#E8B931);opacity:0;transition:opacity .2s}
    .folder:hover{border-color:#D97757;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .folder:hover::before{opacity:1}
    .folder-icon{font-size:28px;margin-bottom:14px}
    .folder h3{font-size:14px;font-weight:600;color:#E8E0D8;margin-bottom:4px}
    .folder p{font-size:12px;color:#8B7E75;line-height:1.4}
    .folder-del{position:absolute;top:12px;right:12px;background:none;border:none;color:#5A4F48;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px;opacity:0;transition:all .15s}
    .folder:hover .folder-del{opacity:1}
    .folder-del:hover{color:#ef4444;background:rgba(239,68,68,.1)}

    .add-folder{background:transparent;border:2px dashed #4A403A;border-radius:14px;padding:22px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px}
    .add-folder:hover{border-color:#D97757;background:rgba(217,119,87,.04)}
    .add-folder span{font-size:28px;color:#5A4F48;margin-bottom:6px}
    .add-folder p{font-size:12px;color:#8B7E75}

    .add-folder-form{background:#3D3530;border:1px solid #D97757;border-radius:14px;padding:18px;display:none}
    .add-folder-form.v{display:block}
    .add-folder-form input{width:100%;padding:10px 14px;background:#2F2722;border:1px solid #4A403A;border-radius:10px;color:#E8E0D8;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;transition:border .2s}
    .add-folder-form input:focus{border-color:#D97757}
    .add-folder-form input::placeholder{color:#8B7E75}
    .add-folder-form .btns{display:flex;gap:8px;justify-content:flex-end}
    .add-folder-form button{padding:7px 16px;border:none;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s}
    .add-folder-form .ok{background:#D97757;color:#fff}
    .add-folder-form .ok:hover{background:#C4684A}
    .add-folder-form .cancel{background:#4A403A;color:#E8E0D8}

    /* ── Day groups ── */
    .day-group{margin-bottom:4px}
    .day-selected{background:rgba(217,119,87,.04);border-radius:10px;padding:4px 0}
    .day-selected .day-hdr{background:rgba(217,119,87,.06);border-radius:10px}
    .day-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-radius:10px;transition:background .15s;user-select:none}
    .day-hdr:hover{background:rgba(255,255,255,.03)}
    .day-arrow{font-size:10px;color:#5A4F48;transition:transform .2s;display:inline-block;width:16px}
    .day-arrow.open{transform:rotate(90deg)}
    .day-title{font-size:13px;font-weight:600;color:#D97757}
    .day-stats{font-size:11px;color:#5A4F48;margin-left:auto}
    .day-check{width:16px;height:16px;accent-color:#D97757;cursor:pointer}

    /* ── Note cards ── */
    .note{padding:14px 18px;background:#3D3530;border:1px solid #4A403A;border-radius:12px;margin:4px 0 4px 28px;cursor:pointer;transition:all .15s}
    .note:hover{border-color:rgba(217,119,87,.35);background:#453D37}
    .note-top{display:flex;justify-content:space-between;align-items:flex-start}
    .note-info{flex:1;min-width:0}
    .note h3{font-size:14px;font-weight:600;color:#E8E0D8;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .note-time{font-size:11px;color:#8B7E75}
    .note-meta{display:flex;gap:10px;font-size:12px;color:#8B7E75;margin-top:5px;align-items:center}
    .tag{background:rgba(217,119,87,.12);color:#D97757;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500}
    .note-pv{font-size:13px;color:#8B7E75;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .note-del{background:none;border:none;color:#5A4F48;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:6px;flex-shrink:0}
    .note-del:hover{color:#ef4444;background:rgba(239,68,68,.1)}

    /* ── Detail ── */
    .detail-hdr{margin-bottom:20px}
    .detail-hdr h2{font-size:22px;font-weight:700;color:#E8E0D8;margin-bottom:8px;line-height:1.3}
    .detail-meta{display:flex;gap:12px;font-size:12px;color:#8B7E75;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{padding:8px 18px;border:1px solid #4A403A;border-radius:10px;background:#3D3530;color:#E8E0D8;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500}
    .btn:hover{background:#4A403A}
    .btn-pri{background:#D97757;border-color:#D97757;color:#fff}
    .btn-pri:hover{background:#C4684A}
    .btn-dng{border-color:rgba(239,68,68,.25);color:#fca5a5}
    .btn-dng:hover{background:rgba(239,68,68,.1)}
    .transcript-box{background:#3D3530;border:1px solid #4A403A;border-radius:12px;padding:24px;line-height:1.85;font-size:14px;white-space:pre-wrap;max-height:55vh;overflow-y:auto;margin-top:16px}
    .transcript-box .ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:#D97757;background:rgba(217,119,87,.1);padding:2px 7px;border-radius:5px;margin-right:10px}
    .summary-box{background:rgba(217,119,87,.06);border:1px solid rgba(217,119,87,.15);border-radius:12px;padding:24px;margin-top:16px;line-height:1.7;font-size:14px;white-space:pre-wrap}
    .summary-box h3{font-size:14px;font-weight:600;color:#D97757;margin-bottom:10px}

    /* ── Live ── */
    .live-line{padding:8px 0;font-size:15px;line-height:1.75;color:#E8E0D8;border-bottom:1px solid rgba(255,255,255,.04)}
    .live-line .ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:#D97757;background:rgba(217,119,87,.1);padding:2px 7px;border-radius:5px;margin-right:10px}
    .live-interim{color:#8B7E75;font-style:italic}

    /* ── Empty ── */
    .empty{text-align:center;padding:60px 20px}
    .empty h2{font-size:22px;color:#8B7E75;margin-bottom:8px}
    .empty p{color:#5A4F48;font-size:14px;line-height:1.6}

    /* ── Scrollbar ── */
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:#4A403A;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#5A4F48}
    @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
    .note,.folder{animation:fi .2s ease-out}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">J</div>
      <h1><span>Justin's</span> AI Note Taker</h1>
    </div>
    <div class="nav-right">
      <input class="nav-search" id="search" placeholder="Search all lectures..." />
      <div class="mtr" id="meter"><div class="mtr-f" id="meterFill"></div></div>
      <span class="wc" id="wordCount">0 words</span>
      <span class="tmr" id="timer">00:00:00</span>
      <button class="nav-rec idle" id="recBtn">Start Recording</button>
    </div>
  </nav>
  <div id="bread" class="bread"></div>
  <div class="main" id="content"></div>
  <script src="app.js"></script>
</body>
</html>
