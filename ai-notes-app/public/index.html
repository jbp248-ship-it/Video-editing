<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Note Taker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0c0f1a; color: #c8d1e0; height: 100vh; display: flex; -webkit-font-smoothing: antialiased; }

    .sidebar { width: 280px; background: #141825; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; }
    .sidebar-header { padding: 24px 20px 16px; }
    .sidebar-header h1 { font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .sidebar-header h1::before { content: ''; width: 8px; height: 8px; background: #6366f1; border-radius: 2px; }
    .sidebar-header p { font-size: 12px; color: #525c70; margin-top: 4px; padding-left: 16px; }
    .search-box { padding: 0 16px 12px; }
    .search-box input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #c8d1e0; font-size: 13px; font-family: inherit; outline: none; }
    .search-box input:focus { border-color: #6366f1; }
    .search-box input::placeholder { color: #3d4555; }

    .course-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .course-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #6b7690; display: flex; align-items: center; gap: 8px; margin-bottom: 1px; transition: all 0.15s; user-select: none; }
    .course-item:hover { background: rgba(255,255,255,0.04); color: #c8d1e0; }
    .course-item.active { background: rgba(99,102,241,0.12); color: #a5b4fc; }
    .course-count { font-size: 11px; background: rgba(255,255,255,0.06); padding: 1px 7px; border-radius: 10px; margin-left: auto; }
    .course-item.active .course-count { background: rgba(99,102,241,0.2); }
    .course-actions { display: none; gap: 2px; }
    .course-item:hover .course-actions { display: flex; }
    .course-action { font-size: 11px; opacity: 0.4; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
    .course-action:hover { opacity: 1; background: rgba(255,255,255,0.08); }

    .add-area { padding: 4px 12px 8px; }
    .add-btn { padding: 9px; background: transparent; border: 1px dashed rgba(255,255,255,0.1); border-radius: 8px; color: #525c70; font-size: 12px; cursor: pointer; text-align: center; width: 100%; transition: all 0.2s; }
    .add-btn:hover { border-color: rgba(99,102,241,0.3); color: #a5b4fc; }
    .add-form { display: none; gap: 6px; }
    .add-form.visible { display: flex; }
    .add-form input { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #c8d1e0; font-size: 13px; font-family: inherit; outline: none; }
    .add-form input:focus { border-color: #6366f1; }
    .add-form button { padding: 8px 14px; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }

    .sidebar-footer { padding: 8px 16px 12px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 11px; color: #3d4555; }

    .main { flex: 1; display: flex; flex-direction: column; }
    .toolbar { padding: 16px 28px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; gap: 16px; background: #111422; }
    .rec-btn { padding: 10px 28px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; }
    .rec-btn.idle { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 2px 12px rgba(239,68,68,0.3); }
    .rec-btn.idle:hover { box-shadow: 0 4px 20px rgba(239,68,68,0.5); transform: translateY(-1px); }
    .rec-btn.active { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
    .timer { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #ef4444; font-variant-numeric: tabular-nums; display: none; }
    .meter { flex: 1; height: 6px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; display: none; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 3px; transition: width 0.08s; width: 0%; }

    .content { flex: 1; overflow-y: auto; padding: 28px; }
    .empty { text-align: center; padding: 100px 20px; }
    .empty h2 { font-size: 22px; color: #525c70; margin-bottom: 8px; }
    .empty p { color: #3d4555; font-size: 14px; }

    .line { padding: 8px 0; font-size: 15px; line-height: 1.7; color: #e2e8f0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .line .ts { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #818cf8; background: rgba(99,102,241,0.1); padding: 2px 7px; border-radius: 4px; margin-right: 10px; }
    .interim { color: #525c70; font-style: italic; }

    .card { padding: 16px 18px; background: #141825; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; animation: fadeIn 0.2s; }
    .card:hover { border-color: rgba(99,102,241,0.3); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card h3 { font-size: 14px; font-weight: 600; color: #e8ecf4; margin-bottom: 6px; }
    .card .meta { font-size: 12px; color: #525c70; display: flex; gap: 14px; }
    .card .preview { font-size: 13px; color: #6b7690; margin-top: 8px; line-height: 1.5; }
    .del-btn { background: none; border: none; color: #3d4555; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .del-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

    .detail-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .detail-hdr h2 { font-size: 22px; font-weight: 700; color: #e8ecf4; }
    .btn-grp { display: flex; gap: 8px; }
    .btn { padding: 7px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.04); color: #c8d1e0; font-size: 12px; font-family: inherit; cursor: pointer; }
    .btn:hover { background: rgba(255,255,255,0.08); }
    .btn.danger { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .btn.danger:hover { background: rgba(239,68,68,0.15); }
    .transcript { background: #141825; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; line-height: 1.8; font-size: 14px; white-space: pre-wrap; max-height: 65vh; overflow-y: auto; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header"><h1>AI Note Taker</h1><p>Instant lecture transcription</p></div>
    <div class="search-box"><input id="search" placeholder="Search lectures..." /></div>
    <div class="course-list" id="courses"></div>
    <div class="add-area">
      <div class="add-btn" id="addBtn">+ Add Course</div>
      <div class="add-form" id="addForm"><input id="addInput" placeholder="Course name..." /><button id="addOk">Add</button></div>
    </div>
    <div class="sidebar-footer">100% free — uses Chrome's built-in speech engine</div>
  </div>
  <div class="main">
    <div class="toolbar">
      <button class="rec-btn idle" id="recBtn">Start Recording</button>
      <span class="timer" id="timer">00:00:00</span>
      <div class="meter" id="meter"><div class="meter-fill" id="meterFill"></div></div>
    </div>
    <div class="content" id="content"><div class="empty"><h2>Welcome</h2><p>Add a course, then click Start Recording.</p></div></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
