<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Note Taker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0c0f1a;color:#c8d1e0;height:100vh;display:flex;-webkit-font-smoothing:antialiased}

    /* Sidebar */
    .sb{width:280px;background:#141825;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;flex-shrink:0}
    .sb-hdr{padding:24px 20px 16px}
    .sb-hdr h1{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
    .sb-hdr h1::before{content:'';width:8px;height:8px;background:#6366f1;border-radius:2px}
    .sb-hdr p{font-size:12px;color:#525c70;margin-top:4px;padding-left:16px}
    .sb-search{padding:0 16px 12px}
    .sb-search input{width:100%;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#c8d1e0;font-size:13px;font-family:inherit;outline:none}
    .sb-search input:focus{border-color:#6366f1}
    .sb-search input::placeholder{color:#3d4555}
    .clist{flex:1;overflow-y:auto;padding:4px 8px}
    .ci{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#6b7690;display:flex;align-items:center;gap:8px;margin-bottom:1px;transition:all .15s;user-select:none}
    .ci:hover{background:rgba(255,255,255,.04);color:#c8d1e0}
    .ci.on{background:rgba(99,102,241,.12);color:#a5b4fc}
    .cc{font-size:11px;background:rgba(255,255,255,.06);padding:1px 7px;border-radius:10px;margin-left:auto}
    .ci.on .cc{background:rgba(99,102,241,.2)}
    .ca{display:none;gap:2px}
    .ci:hover .ca{display:flex}
    .cx{font-size:11px;opacity:.4;cursor:pointer;padding:2px 5px;border-radius:4px}
    .cx:hover{opacity:1;background:rgba(255,255,255,.08)}
    .add-a{padding:4px 12px 8px}
    .add-b{padding:9px;background:0;border:1px dashed rgba(255,255,255,.1);border-radius:8px;color:#525c70;font-size:12px;cursor:pointer;text-align:center;width:100%;transition:all .2s}
    .add-b:hover{border-color:rgba(99,102,241,.3);color:#a5b4fc}
    .add-f{display:none;gap:6px}
    .add-f.v{display:flex}
    .add-f input{flex:1;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:#c8d1e0;font-size:13px;font-family:inherit;outline:none}
    .add-f input:focus{border-color:#6366f1}
    .add-f button{padding:8px 14px;background:#6366f1;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
    .sb-ft{padding:8px 16px 12px;border-top:1px solid rgba(255,255,255,.04);font-size:11px;color:#3d4555}

    /* Main */
    .mn{flex:1;display:flex;flex-direction:column;min-width:0}
    .tb{padding:14px 28px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:16px;background:#111422}
    .rb{padding:10px 28px;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
    .rb.idle{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 12px rgba(239,68,68,.3)}
    .rb.idle:hover{box-shadow:0 4px 20px rgba(239,68,68,.5);transform:translateY(-1px)}
    .rb.on{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}
    .tmr{font-family:'JetBrains Mono',monospace;font-size:15px;color:#ef4444;font-variant-numeric:tabular-nums;display:none}
    .mtr{flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden;display:none}
    .mtr-f{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:3px;transition:width 80ms;width:0}
    .wc{font-size:11px;color:#525c70;display:none}

    /* Content */
    .ct{flex:1;overflow-y:auto;padding:28px}
    .empty{text-align:center;padding:80px 20px}
    .empty h2{font-size:22px;color:#525c70;margin-bottom:8px}
    .empty p{color:#3d4555;font-size:14px;line-height:1.6}

    /* Live */
    .ln{padding:8px 0;font-size:15px;line-height:1.7;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,.03)}
    .ln .ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:#818cf8;background:rgba(99,102,241,.1);padding:2px 7px;border-radius:4px;margin-right:10px}
    .ln.it{color:#525c70;font-style:italic}
    .ln.conf-high{color:#e2e8f0}
    .ln.conf-med{color:#a0a8b8}
    .ln.conf-low{color:#6b7690}

    /* Cards */
    .cd{padding:16px 18px;background:#141825;border:1px solid rgba(255,255,255,.05);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s;animation:fi .2s}
    .cd:hover{border-color:rgba(99,102,241,.3);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .cd-t{display:flex;justify-content:space-between;align-items:flex-start}
    .cd h3{font-size:14px;font-weight:600;color:#e8ecf4;margin-bottom:6px}
    .cd .mt{font-size:12px;color:#525c70;display:flex;gap:14px}
    .cd .pv{font-size:13px;color:#6b7690;margin-top:8px;line-height:1.5}
    .db{background:none;border:none;color:#3d4555;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px}
    .db:hover{color:#ef4444;background:rgba(239,68,68,.1)}

    /* Detail */
    .dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .dh h2{font-size:22px;font-weight:700;color:#e8ecf4}
    .bg{display:flex;gap:8px;flex-wrap:wrap}
    .bt{padding:7px 16px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(255,255,255,.04);color:#c8d1e0;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
    .bt:hover{background:rgba(255,255,255,.08)}
    .bt.dng{border-color:rgba(239,68,68,.3);color:#fca5a5}
    .bt.dng:hover{background:rgba(239,68,68,.15)}
    .bt.pri{background:#6366f1;border-color:#6366f1;color:#fff}
    .bt.pri:hover{background:#5558e6}
    .tr{background:#141825;border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:20px;line-height:1.8;font-size:14px;white-space:pre-wrap;max-height:50vh;overflow-y:auto}

    /* Summary */
    .sum{background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.15);border-radius:10px;padding:20px;margin-top:16px;line-height:1.7;font-size:14px;white-space:pre-wrap}
    .sum h3{font-size:14px;font-weight:600;color:#a5b4fc;margin-bottom:8px}
    .sum-loading{color:#818cf8;font-style:italic}

    /* Stats */
    .stats{display:flex;gap:20px;margin:12px 0;font-size:12px;color:#525c70}
    .stats span{display:flex;align-items:center;gap:4px}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
    @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  </style>
</head>
<body>
  <div class="sb">
    <div class="sb-hdr"><h1>AI Note Taker</h1><p>Instant lecture transcription</p></div>
    <div class="sb-search"><input id="search" placeholder="Search lectures..." /></div>
    <div class="clist" id="courses"></div>
    <div class="add-a">
      <div class="add-b" id="addBtn">+ Add Course</div>
      <div class="add-f" id="addForm"><input id="addInput" placeholder="Course name..." /><button id="addOk">Add</button></div>
    </div>
    <div class="sb-ft">Free &middot; Ctrl+R to record &middot; Installable as app</div>
  </div>
  <div class="mn">
    <div class="tb">
      <button class="rb idle" id="recBtn">Start Recording</button>
      <span class="tmr" id="timer">00:00:00</span>
      <span class="wc" id="wordCount">0 words</span>
      <div class="mtr" id="meter"><div class="mtr-f" id="meterFill"></div></div>
    </div>
    <div class="ct" id="content"><div class="empty"><h2>Welcome</h2><p>Add a course in the sidebar, then click Start Recording.<br>Works best in Chrome. Your words appear instantly as you speak.</p></div></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
