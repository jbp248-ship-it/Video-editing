<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Note Taker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0f1a;
      color: #c8d1e0;
      height: 100vh;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      background: #141825;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
    }

    .sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #6366f1;
      border-radius: 2px;
    }

    .sidebar-header p {
      font-size: 12px;
      color: #525c70;
      margin-top: 4px;
      padding-left: 16px;
    }

    .search-box {
      padding: 0 16px 12px;
    }

    .search-box input, .add-course-input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #c8d1e0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-box input::placeholder, .add-course-input::placeholder { color: #3d4555; }
    .search-box input:focus, .add-course-input:focus {
      border-color: #6366f1;
      background: rgba(99,102,241,0.05);
    }

    .course-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .course-item {
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #6b7690;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1px;
      transition: all 0.15s;
      user-select: none;
    }

    .course-item:hover { background: rgba(255,255,255,0.04); color: #c8d1e0; }
    .course-item.active { background: rgba(99,102,241,0.12); color: #a5b4fc; }

    .course-count {
      font-size: 11px;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      padding: 1px 7px;
      border-radius: 10px;
      margin-left: auto;
    }

    .course-item.active .course-count {
      background: rgba(99,102,241,0.2);
    }

    .course-actions { display: none; gap: 2px; }
    .course-item:hover .course-actions { display: flex; }

    .course-action {
      font-size: 11px;
      opacity: 0.4;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .course-action:hover { opacity: 1; background: rgba(255,255,255,0.08); }

    /* ── Add course: inline input that appears on click ── */
    .add-course-area {
      padding: 4px 12px 8px;
    }

    .add-course-btn {
      padding: 9px;
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #525c70;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      width: 100%;
    }

    .add-course-btn:hover {
      border-color: rgba(99,102,241,0.3);
      color: #a5b4fc;
      background: rgba(99,102,241,0.05);
    }

    .add-course-form {
      display: none;
    }

    .add-course-form.visible {
      display: flex;
      gap: 6px;
    }

    .add-course-form .add-ok {
      padding: 8px 12px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-course-form .add-ok:hover { background: #5558e6; }

    .source-badge {
      font-size: 10px;
      font-weight: 600;
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .sidebar-footer {
      padding: 8px 16px 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .sidebar-footer > div {
      font-size: 11px;
      color: #3d4555;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
    }

    .net-dot, .ext-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .net-dot.online, .ext-dot.connected { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }
    .net-dot.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.4); }
    .ext-dot.disconnected { background: #3d4555; }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .toolbar {
      padding: 16px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      gap: 16px;
      background: #111422;
    }

    .record-btn {
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: -0.2px;
    }

    .record-btn.start {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 2px 12px rgba(239,68,68,0.3);
    }
    .record-btn.start:hover {
      box-shadow: 0 4px 20px rgba(239,68,68,0.5);
      transform: translateY(-1px);
    }
    .record-btn.stop {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      box-shadow: 0 2px 12px rgba(245,158,11,0.3);
    }

    .timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
    }

    .audio-meter {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
      overflow: hidden;
    }

    .audio-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 3px;
      transition: width 0.08s ease-out;
      width: 0%;
    }

    /* ── Content ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .empty-state {
      text-align: center;
      padding: 100px 20px;
    }

    .empty-state h2 {
      font-size: 22px;
      font-weight: 600;
      color: #525c70;
      margin-bottom: 8px;
    }

    .empty-state p { color: #3d4555; font-size: 14px; line-height: 1.6; }

    .transcript-line {
      padding: 8px 0;
      font-size: 15px;
      line-height: 1.7;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .transcript-line .ts {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #818cf8;
      background: rgba(99,102,241,0.1);
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 10px;
    }

    .interim { color: #525c70; font-style: italic; }

    .note-card {
      padding: 16px 18px;
      background: #141825;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .note-card:hover {
      border-color: rgba(99,102,241,0.3);
      background: #181c2e;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .note-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #3d4555;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: rgba(239,68,68,0.1);
    }

    .note-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #e8ecf4;
      margin-bottom: 6px;
    }

    .note-card .meta {
      font-size: 12px;
      color: #525c70;
      display: flex;
      gap: 14px;
    }

    .note-card .preview {
      font-size: 13px;
      color: #6b7690;
      margin-top: 8px;
      line-height: 1.5;
    }

    .note-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .note-detail-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #e8ecf4;
    }

    .note-detail-header .meta {
      font-size: 12px;
      color: #525c70;
      display: flex;
      gap: 14px;
      margin-top: 4px;
    }

    .btn-group { display: flex; gap: 8px; }

    .btn {
      padding: 7px 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      color: #c8d1e0;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover { background: rgba(255,255,255,0.08); }
    .btn.danger { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .btn.danger:hover { background: rgba(239,68,68,0.15); }

    .full-transcript {
      background: #141825;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 20px;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-wrap;
      max-height: 65vh;
      overflow-y: auto;
    }

    /* ── Rename modal (kept simple) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #1a1f30;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 28px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #e8ecf4;
    }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #c8d1e0;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal input:focus { border-color: #6366f1; }
    .modal input::placeholder { color: #3d4555; }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions .btn-primary {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }
    .modal-actions .btn-primary:hover { background: #5558e6; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .note-card { animation: fadeIn 0.2s ease-out; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>AI Note Taker</h1>
      <p>Record lectures, transcribe instantly</p>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search lectures..." />
    </div>
    <div class="course-list" id="courseList"></div>

    <!-- Add course: inline input, no modal needed -->
    <div class="add-course-area">
      <button class="add-course-btn" id="addCourseBtn">+ Add Course</button>
      <div class="add-course-form" id="addCourseForm">
        <input type="text" class="add-course-input" id="addCourseInput" placeholder="Course name..." />
        <button class="add-ok" id="addCourseOk">Add</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <div id="modelStatus">Loading Whisper model...</div>
      <div id="extStatus">
        <span class="ext-dot disconnected"></span> Extension: not connected
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <button class="record-btn start" id="recordBtn">Start Recording (Ctrl+R)</button>
      <span class="timer" id="timer" style="display:none">00:00:00</span>
      <div class="audio-meter" id="meterContainer" style="display:none">
        <div class="audio-meter-fill" id="meterFill"></div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="empty-state">
        <h2>Welcome to AI Note Taker</h2>
        <p>Add a course in the sidebar, then click<br/>Start Recording to begin transcribing.</p>
      </div>
    </div>
  </div>

  <!-- Modal for rename only -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal">
      <h3 id="modalTitle">Rename Course</h3>
      <input type="text" id="modalInput" placeholder="New name..." autofocus />
      <div class="modal-actions">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalOk">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
