<!DOCTYPE html>
<html>
<head>
  <title>Allow Microphone</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f9fafb;
      text-align: center;
      padding: 20px;
    }
    h2 { font-size: 18px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
    .status { font-size: 16px; font-weight: 600; }
    .success { color: #059669; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h2>AI Note Taker</h2>
  <p>Requesting microphone access...</p>
  <div class="status" id="status"></div>
  <script>
    (async () => {
      const el = document.getElementById("status");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
        el.textContent = "Microphone allowed! This window will close...";
        el.className = "status success";
        // Tell the service worker that permission was granted
        chrome.runtime.sendMessage({ type: "mic-permission-granted" });
        setTimeout(() => window.close(), 1000);
      } catch (err) {
        el.textContent = "Microphone denied. Please click Allow when prompted.";
        el.className = "status error";
      }
    })();
  </script>
</body>
</html>
