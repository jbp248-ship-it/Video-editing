<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicketReselling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #FAF9F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #3D3929;
      user-select: none;
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(217,119,6,0.25);
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .logo-wrap svg {
      width: 56px;
      height: 56px;
    }

    .app-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1C1A14;
      animation: fade-up 0.4s 0.1s ease both;
    }

    .tagline {
      font-size: 14px;
      color: #8B7E5A;
      margin-top: 6px;
      animation: fade-up 0.4s 0.2s ease both;
    }

    .loader {
      margin-top: 40px;
      display: flex;
      gap: 7px;
      animation: fade-up 0.4s 0.3s ease both;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D97706;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #B8A87A;
      animation: fade-up 0.4s 0.35s ease both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes fade-up {
      from { transform: translateY(8px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- ticket body -->
      <rect x="4" y="16" width="48" height="24" rx="5" fill="white" opacity="0.95"/>
      <!-- left notch -->
      <circle cx="4" cy="28" r="5" fill="#D97706"/>
      <!-- right notch -->
      <circle cx="52" cy="28" r="5" fill="#D97706"/>
      <!-- dashed line -->
      <line x1="16" y1="16" x2="16" y2="40" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
      <!-- text lines -->
      <rect x="22" y="21" width="20" height="3" rx="1.5" fill="#D97706" opacity="0.3"/>
      <rect x="22" y="27" width="16" height="2.5" rx="1.25" fill="#D97706" opacity="0.2"/>
      <rect x="22" y="32" width="22" height="3" rx="1.5" fill="#D97706" opacity="0.15"/>
      <!-- $ sign -->
      <text x="9" y="33" font-family="system-ui" font-size="10" font-weight="bold" fill="#D97706" opacity="0.7">$</text>
    </svg>
  </div>

  <div class="app-name">TicketReselling</div>
  <div class="tagline">Professional Ticket Reselling Suite</div>

  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="status" id="status">Starting up...</div>

  <script>
    const messages = [
      "Starting up...",
      "Initializing database...",
      "Loading market data...",
      "Almost ready..."
    ];
    let i = 0;
    const el = document.getElementById("status");
    setInterval(() => {
      i = (i + 1) % messages.length;
      el.style.opacity = "0";
      setTimeout(() => {
        el.textContent = messages[i];
        el.style.transition = "opacity 0.3s";
        el.style.opacity = "1";
      }, 150);
    }, 2000);
  </script>
</body>
</html>
