<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Ticket shape - white -->
  <g transform="translate(256,256) rotate(-30)">
    <!-- Ticket body -->
    <rect x="-150" y="-80" width="300" height="160" rx="16" fill="white" opacity="0.95"/>
    <!-- Ticket notches (left) -->
    <circle cx="-150" cy="0" r="20" fill="#D97706"/>
    <!-- Ticket notches (right) -->
    <circle cx="150" cy="0" r="20" fill="#D97706"/>
    <!-- Dashed line -->
    <line x1="-80" y1="-80" x2="-80" y2="80" stroke="#D97706" stroke-width="3" stroke-dasharray="8,6" opacity="0.4"/>
    <!-- Star on stub -->
    <polygon points="-115,0 -108,-12 -95,-14 -104,-23 -102,-36 -115,-30 -128,-36 -126,-23 -135,-14 -122,-12" fill="#D97706" opacity="0.7"/>
    <!-- Text lines on ticket -->
    <rect x="-55" y="-40" width="120" height="10" rx="5" fill="#D97706" opacity="0.3"/>
    <rect x="-55" y="-20" width="90" height="8" rx="4" fill="#D97706" opacity="0.2"/>
    <rect x="-55" y="0" width="150" height="12" rx="6" fill="#D97706" opacity="0.15"/>
    <rect x="-55" y="22" width="70" height="8" rx="4" fill="#D97706" opacity="0.2"/>
    <!-- Price -->
    <text x="50" y="55" font-family="system-ui,sans-serif" font-size="28" font-weight="bold" fill="#D97706" text-anchor="middle" opacity="0.6">$</text>
  </g>
</svg>
